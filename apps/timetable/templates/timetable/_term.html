{% if terms|length > 1 %}
<form method="get" class="term">
  {% if day %}<input type="hidden" name="day" value="{{ day }}">{% endif %}
  <label for="term" class="muted">Term</label>
  <select id="term" name="term" onchange="this.form.submit()">
    {% for t in terms %}<option value="{{ t.pk }}"{% if t.pk == term.pk %} selected{% endif %}>{{ t }}</option>{% endfor %}
  </select>
  <noscript><button type="submit">Show</button></noscript>
</form>
{% endif %}
