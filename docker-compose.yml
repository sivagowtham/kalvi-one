# Local development stack: Django + PostgreSQL.
# Usage: cp .env.example .env && make up
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalvione}
      POSTGRES_USER: ${POSTGRES_USER:-kalvione}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalvione}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kalvione} -d ${POSTGRES_DB:-kalvione}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
